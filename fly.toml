# fly.toml app configuration file for Produktifa
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "produktifa-app"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_PATH = "/app/data/produktifa.db"

# Mount persistent volume for SQLite database storage (Free tier includes 3GB volume quota)
[mounts]
  source = "produktifa_data"
  destination = "/app/data"
  initial_size = "1GB"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
